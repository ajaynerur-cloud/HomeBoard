<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="HomeBoard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="55%" stop-color="#0d5f5a"/>
      <stop offset="100%" stop-color="#0a4a4f"/>
    </linearGradient>
    <linearGradient id="roofGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
<rect width="512" height="512" fill="url(#bg)"/>
<rect width="512" height="512" fill="url(#roofGlow)"/>
<g transform="translate(256,256) scale(0.74) translate(-256,-256)">

  <!-- house: roof + walls, drawn as one cream mass -->
  <path d="M256 92 L436 236 V400 a28 28 0 0 1-28 28 H104 a28 28 0 0 1-28-28 V236 Z"
        fill="#FBF6EC"/>

  <!-- the tick sitting inside the house -->
  <path d="M170 292 L228 350 L346 232"
        fill="none" stroke="#0f766e" stroke-width="44"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- eave line, gives the roof its edge -->
  <path d="M46 246 L256 78 L466 246"
        fill="none" stroke="#FBF6EC" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>

</g>
</svg>