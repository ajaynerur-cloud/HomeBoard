name: Build Android APK

# Builds an installable HomeBoard APK in the cloud — no Android Studio needed.
# Run it from the Actions tab: "Build Android APK" → "Run workflow".
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Your live HomeBoard URL (e.g. https://homeboard.onrender.com)"
        required: true
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Point the app at the live server
        env:
          URL_INPUT: ${{ github.event.inputs.server_url }}
          URL_VAR: ${{ vars.HOMEBOARD_URL }}
        run: |
          URL="${URL_INPUT:-$URL_VAR}"
          if [ -z "$URL" ]; then
            echo "No server URL. Pass it when running the workflow, or set a repo variable HOMEBOARD_URL."
            exit 1
          fi
          echo "Building against $URL"
          node -e "
            const fs=require('fs');
            const c=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));
            c.server.url=process.env.URL;
            fs.writeFileSync('capacitor.config.json', JSON.stringify(c,null,2));
          "

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets@3

      - name: Create the native project
        run: npx cap add android

      - name: Generate launcher icons and splash
        run: npx @capacitor/assets generate --android --assetPath resources

      - name: Sync
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: HomeBoard-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
