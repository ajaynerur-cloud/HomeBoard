services:
  - type: web
    name: homeboard
    runtime: node
    plan: free
    region: singapore
    # --omit=dev skips the Capacitor packages, which are only for building the APK
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: GITHUB_TOKEN
        sync: false
      - key: DATA_REPO
        sync: false
      - key: DATA_BRANCH
        value: main
      - key: DATA_DIR
        value: data
      # New-task push to the Android APK. Paste the Firebase service-account
      # JSON (raw or base64). Web push needs nothing — its keys are generated
      # on first start and kept in the private data repo.
      - key: FCM_SERVICE_ACCOUNT
        sync: false
